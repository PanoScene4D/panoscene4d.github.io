<!DOCTYPE html>
<html>
    <head>
        <title>SuperSplat</title>
        <meta charset="utf-8" />
        <base href="__BASE_HREF__">
        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="./index.css?v=20260414-fps">
        <link rel="shortcut icon" href="#">
        <meta name="description" content="SuperSplat is an advanced browser-based editor for manipulating and optimizing 3D Gaussian Splats. It is open source and engine agnostic." />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
        <style>
            html,
            body {
                min-height: 100%;
            }

            body.scene-browser-mode {
                margin: 0;
                overflow: auto;
                color: #111827;
                background:
                    radial-gradient(circle at 12% 0%, rgba(99, 102, 241, 0.11), transparent 34rem),
                    radial-gradient(circle at 92% 18%, rgba(14, 165, 233, 0.1), transparent 30rem),
                    #f6f8fc;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                letter-spacing: 0;
            }

            .scene-browser {
                min-height: 100vh;
                box-sizing: border-box;
                padding: 28px;
            }

            .scene-browser__shell {
                width: min(1280px, 100%);
                margin: 0 auto;
            }

            .scene-browser__topbar {
                display: grid;
                grid-template-columns: 1fr minmax(220px, 340px);
                gap: 16px;
                align-items: end;
                padding-bottom: 18px;
                border-bottom: 1px solid #d9dee7;
            }

            .scene-browser__kicker {
                margin: 0 0 5px;
                color: #536273;
                font-size: 12px;
                font-weight: 700;
                text-transform: uppercase;
            }

            .scene-browser__title {
                margin: 0;
                color: #111827;
                font-size: 28px;
                line-height: 1.15;
                font-weight: 760;
            }

            .scene-browser__search {
                width: 100%;
                height: 40px;
                box-sizing: border-box;
                border: 1px solid #c8d0dc;
                border-radius: 6px;
                padding: 0 12px;
                color: #111827;
                background: #ffffff;
                font: inherit;
                outline: none;
            }

            .scene-browser__search:focus {
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
            }

            .scene-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
                gap: 20px;
                margin-top: 24px;
            }

            .scene-card {
                display: grid;
                grid-template-rows: auto 1fr auto;
                box-sizing: border-box;
                border: 1px solid rgba(203, 213, 225, 0.85);
                border-radius: 16px;
                background: rgba(255, 255, 255, 0.94);
                overflow: hidden;
                box-shadow: 0 10px 28px rgba(15, 23, 42, 0.07);
                transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
            }

            .scene-card:hover {
                transform: translateY(-2px);
                border-color: rgba(99, 102, 241, 0.35);
                box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
            }

            .scene-card__media {
                padding: 8px;
                background: #eef2f7;
            }

            .scene-card__gs-preview {
                display: block;
                width: 100%;
                aspect-ratio: 2 / 1;
                background: #e8edf4;
                border-radius: 9px;
                overflow: hidden;
            }

            .scene-card__preview {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .scene-card__gs-preview {
                position: relative;
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                border: 0;
                cursor: pointer;
            }

            .scene-card__gs-preview img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 160ms ease;
            }

            .scene-card__gs-preview:hover img,
            .scene-card__gs-preview:focus-visible img {
                transform: scale(1.035);
            }

            .scene-card__body {
                padding: 17px 18px 13px;
            }

            .scene-card__title {
                margin: 0;
                color: #111827;
                font-size: 17px;
                line-height: 1.25;
                font-weight: 720;
                overflow-wrap: anywhere;
            }

            .scene-card__actions {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 10px;
                padding: 0 18px 18px;
            }

            .scene-button {
                height: 42px;
                border: 1px solid transparent;
                border-radius: 10px;
                padding: 0 14px;
                color: #ffffff;
                background: linear-gradient(135deg, #4f46e5, #2563eb);
                font: inherit;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
            }

            .scene-button:hover {
                transform: translateY(-1px);
                box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
            }

            .scene-button--secondary {
                color: #1f2937;
                background: #ffffff;
                border-color: #c8d0dc;
            }

            .scene-button--secondary:hover {
                color: #111827;
                background: #f1f5f9;
                box-shadow: none;
            }

            .scene-button--360 {
                color: #ffffff;
                background: linear-gradient(135deg, #7c3aed, #4f46e5);
            }

            .scene-button--360:hover {
                box-shadow: 0 8px 18px rgba(109, 40, 217, 0.22);
            }

            .video-dialog {
                position: fixed;
                inset: 0;
                z-index: 10000;
                display: none;
                place-items: center;
                box-sizing: border-box;
                padding: 28px;
                background: rgba(2, 6, 23, 0.78);
                backdrop-filter: blur(12px);
            }

            .video-dialog.is-open {
                display: grid;
            }

            .video-dialog__panel {
                width: min(1180px, 100%);
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-radius: 18px;
                background: #0f172a;
                overflow: hidden;
                box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
            }

            .video-dialog__header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 14px 16px 14px 20px;
                color: #f8fafc;
            }

            .video-dialog__title {
                margin: 0;
                font-size: 16px;
                font-weight: 720;
            }

            .video-dialog__close {
                width: 36px;
                height: 36px;
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 9px;
                color: #ffffff;
                background: rgba(255, 255, 255, 0.08);
                font-size: 22px;
                line-height: 1;
                cursor: pointer;
            }

            .video-dialog__video {
                display: block;
                width: 100%;
                max-height: calc(100vh - 140px);
                aspect-ratio: 2 / 1;
                background: #000000;
            }

            .scene-empty {
                display: none;
                margin-top: 18px;
                border: 1px dashed #bac4d3;
                border-radius: 8px;
                padding: 22px;
                color: #536273;
                background: #ffffff;
            }

            .scene-empty.is-visible {
                display: block;
            }

            @media (max-width: 720px) {
                .scene-browser {
                    padding: 18px;
                }

                .scene-browser__topbar {
                    grid-template-columns: 1fr;
                    align-items: stretch;
                }

                .scene-browser__title {
                    font-size: 23px;
                }

                .scene-grid {
                    grid-template-columns: minmax(0, 1fr);
                }

                .video-dialog {
                    padding: 12px;
                }

                .scene-card__actions {
                    gap: 7px;
                }

                .scene-button {
                    min-height: 44px;
                    height: auto;
                    padding: 7px 8px;
                    font-size: 12px;
                    line-height: 1.2;
                }
            }
        </style>

        <!-- Disable service worker for local WebXR testing to avoid stale model/bundle caches. -->
        <script>
            const sw = navigator.serviceWorker;
            if (sw) {
                sw.getRegistrations()
                    .then(registrations => registrations.forEach(registration => registration.unregister()))
                    .catch(err => console.log('failed to unregister service worker', err));
            }
        </script>
    </head>

    <body>
        <script type="module">
            const hasViewerParams = (params) => {
                return ['load', 'sequence', 'deferLoad'].some((name) => params.has(name));
            };

            const loadSceneCatalog = async () => {
                const response = await fetch('./catalog.json', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Failed to load scene catalog: ${response.status}`);
                }
                const catalog = await response.json();
                return Array.isArray(catalog) ? catalog : [];
            };

            const toSceneUrl = (scene) => {
                const params = new URLSearchParams();
                params.set('sequence', scene.sequence);
                if (scene.deferLoad) {
                    params.set('deferLoad', scene.deferLoad);
                    params.set('deferFilename', scene.deferFilename || scene.deferLoad.split('/').pop());
                }
                return `./?${params.toString()}`;
            };

            const openScene = (scene) => {
                window.location.assign(toSceneUrl(scene));
            };

            const open360Video = (scene) => {
                const params = new URLSearchParams();
                params.set('src', scene.video);
                params.set('title', `${scene.title} — 360 Video`);
                window.location.assign(`./video360_player.html#${params.toString()}`);
            };

            const mountSceneBrowser = async () => {
                let sceneCatalog = [];
                try {
                    sceneCatalog = await loadSceneCatalog();
                } catch (error) {
                    console.error(error);
                }

                document.body.classList.add('scene-browser-mode');
                document.body.innerHTML = `
                    <main class="scene-browser" aria-label="PanoScene4D scene browser">
                        <div class="scene-browser__shell">
                            <header class="scene-browser__topbar">
                                <div>
                                    <p class="scene-browser__kicker">PanoScene4D</p>
                                    <h1 class="scene-browser__title">Scene Library</h1>
                                </div>
                                <input class="scene-browser__search" type="search" placeholder="Search scenes" aria-label="Search scenes">
                            </header>
                            <section class="scene-grid" aria-live="polite"></section>
                            <div class="scene-empty">No matching scenes.</div>
                        </div>
                    </main>
                    <div class="video-dialog" aria-hidden="true">
                        <section class="video-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="video-dialog-title">
                            <header class="video-dialog__header">
                                <h2 class="video-dialog__title" id="video-dialog-title"></h2>
                                <button class="video-dialog__close" type="button" aria-label="Close video">&times;</button>
                            </header>
                            <video class="video-dialog__video" controls playsinline></video>
                        </section>
                    </div>
                `;

                const grid = document.querySelector('.scene-grid');
                const search = document.querySelector('.scene-browser__search');
                const empty = document.querySelector('.scene-empty');
                const videoDialog = document.querySelector('.video-dialog');
                const dialogVideo = document.querySelector('.video-dialog__video');
                const dialogTitle = document.querySelector('.video-dialog__title');

                const closeVideo = () => {
                    dialogVideo.pause();
                    dialogVideo.removeAttribute('src');
                    dialogVideo.load();
                    videoDialog.classList.remove('is-open');
                    videoDialog.setAttribute('aria-hidden', 'true');
                };

                const openVideo = (scene) => {
                    dialogTitle.textContent = `${scene.title} — Original Video`;
                    dialogVideo.src = scene.video;
                    videoDialog.classList.add('is-open');
                    videoDialog.setAttribute('aria-hidden', 'false');
                    dialogVideo.play().catch(() => {});
                };

                videoDialog.addEventListener('click', (event) => {
                    if (event.target === videoDialog) closeVideo();
                });
                videoDialog.querySelector('.video-dialog__close').addEventListener('click', closeVideo);
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape' && videoDialog.classList.contains('is-open')) closeVideo();
                });

                const render = () => {
                    const query = search.value.trim().toLowerCase();
                    const scenes = sceneCatalog.filter((scene) => {
                        return [scene.title, scene.id, scene.sequence, ...(scene.tags || [])]
                            .join(' ')
                            .toLowerCase()
                            .includes(query);
                    });

                    grid.innerHTML = '';
                    empty.classList.toggle('is-visible', scenes.length === 0);

                    for (const scene of scenes) {
                        const card = document.createElement('article');
                        card.className = 'scene-card';
                        const hasVideo = Boolean(scene.video);
                        card.innerHTML = `
                            <div class="scene-card__media">
                                <button class="scene-card__gs-preview" type="button" aria-label="Open ${scene.title} Gaussian splat">
                                    <img class="scene-card__preview" alt="">
                                </button>
                            </div>
                            <div class="scene-card__body">
                                <h2 class="scene-card__title"></h2>
                            </div>
                            <div class="scene-card__actions">
                                <button class="scene-button scene-button--secondary scene-button--video" type="button">Open Input Video</button>
                                <button class="scene-button scene-button--360" type="button">Open 360 Video</button>
                                <button class="scene-button scene-button--gs" type="button">Open GS World</button>
                            </div>
                        `;

                        card.querySelector('.scene-card__title').textContent = scene.title;
                        const preview = card.querySelector('.scene-card__preview');
                        preview.src = scene.thumbnail;

                        card.querySelector('.scene-button--gs').addEventListener('click', () => openScene(scene));
                        card.querySelector('.scene-card__gs-preview').addEventListener('click', () => openScene(scene));
                        const videoButton = card.querySelector('.scene-button--video');
                        const video360Button = card.querySelector('.scene-button--360');
                        if (hasVideo) {
                            videoButton.addEventListener('click', () => openVideo(scene));
                            video360Button.addEventListener('click', () => open360Video(scene));
                        } else {
                            videoButton.hidden = true;
                            video360Button.hidden = true;
                            card.querySelector('.scene-card__actions').style.gridTemplateColumns = '1fr';
                        }

                        grid.appendChild(card);
                    }
                };

                search.addEventListener('input', render);
                render();
            };

            const params = new URLSearchParams(window.location.search);
            if (hasViewerParams(params)) {
                await import('./index.js?v=20260802-sequence-first-frame');
            } else {
                await mountSceneBrowser();
            }
        </script>
    </body>
</html>
